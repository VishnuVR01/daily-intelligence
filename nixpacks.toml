# nixpacks.toml — Deterministic Railway Python 3.12 Build & Runtime Configuration

[providers]
providers = ["python"]

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
    "python3.12 -m venv /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip",
    "/opt/venv/bin/pip install -r requirements.txt"
]

[variables]
PYTHONUNBUFFERED = "1"
PATH = "/opt/venv/bin:$PATH"
